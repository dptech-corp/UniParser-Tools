[project]
name = "uniparser-mcp"
version = "0.2.0"
description = "MCP server exposing UniParser parse via uniparser-tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.10.0,<2",
    "pydantic>=2.0",
    "uniparser-tools",
]

[tool.uv.sources]
uniparser-tools = { path = "../", editable = true }

[project.scripts]
uniparser-mcp = "uniparser_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["uniparser_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
